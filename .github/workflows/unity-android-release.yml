# Reusable workflow: the release of a Unity Android game from a tag vX.Y.Z (a push of the tag, or a manual run from
# it), on a self-hosted Windows runner: a signed store AAB, one universal APK made from that same AAB for QA, both on a
# Google Shared Drive folder, and one chat card (START before Unity, END from the notify job). The game repository
# calls it from its own workflow (triggers, concurrency and secrets stay there):
#
#   jobs:
#     release:
#       if: github.ref_type == 'tag'
#       permissions: { contents: write, actions: read }
#       uses: Association-of-stupid-people/ci-sdk/.github/workflows/unity-android-release.yml@<runner sha> # ci-sdk vX.Y.Z
#       with:
#         clean: ${{ inputs.clean == true }}
#       secrets:
#         UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
#         ...
#
# A game in another organization cannot use `secrets: inherit`: it passes each secret (see on.workflow_call.secrets).
# Every github.* value (event, ref, sha, actor, run) is the caller's run. Pin the workflow to a commit of the runner
# branch: publish.yml pins every ci-sdk action used here to the runner commit of the same publish. contents: write is
# for the keystore job only (every other job here asks for read).
#
# The game needs no release build method: ci-sdk unity-android-build-script adds a CI-only one for that build: a store
# AAB (not a development build) with bundleVersion X.Y.Z and version code X*10000+Y*100+Z; a tag that is not strict
# X.Y.Z, or has Y or Z >= 100, fails before Unity starts. The project's scripting backend is kept (IL2CPP). The project
# is restored afterwards. Anyone who can push a tag can release. ci-sdk aab-to-apk then turns that AAB into one
# universal APK (bundletool), signed with the same keystore. A release never gets the BIBG Debug View.
# Signing: the secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEYSTORE_ALIAS and KEYSTORE_ALIAS_PASSWORD when they are set
# (all four), else the keystore of ProjectSettings (for instance <repo name>.keystore, committed; password = its file
# name), else a keystore at the project root or committed in the project, else the default branch's keystore, else a
# new one generated by the same convention. The default branch is the reference: a keystore that git does not track
# (left on the runner by an earlier run) is used only when the default branch has the same one or none, and a new one
# only when it has none. One that is not there yet is committed by the keystore job (the workflow's only write; the
# build job stays read-only; the card says so), so every later release signs with the same key. Never a debug key.
# Leave the secrets empty for the committed keystore: never set one to the repository name (its password) or to a
# common word (an alias such as `release`): GitHub masks a secret's value everywhere in the logs and drops the job
# outputs holding it. The alias also reaches bundletool on its command line (bundletool reads only the passwords from
# files).
#
# Secrets: UNITY_LICENSE (content of the Unity .ulf file, only its serial is used), UNITY_EMAIL and UNITY_PASSWORD
# (the Unity account of that license). GDRIVE_SERVICE_ACCOUNT_KEY, GDRIVE_FOLDER_ID and CHAT_WEBHOOK_URL as in
# unity-android-debug.yml: empty Drive secrets keep the files as GitHub artifacts (7 days), an empty webhook posts
# nothing. A failed upload fails the run; a failed webhook call does not.
# Logs: the Unity log goes next to the AAB and APK on Drive, whatever the result; for a job that failed or was
# cancelled, the notify job also puts its full GitHub job log on Drive. Chat: START right before Unity (the tag and the
# keystore are checked by now), then one END: ✅, ⚠️ (built, but an upload or the keystore commit failed), ❌ (the
# failed step and the log) or 🚫 (cancelled). A job stopped by its own timeout-minutes is ❌ "(timed out)".
# Caches: the release reuses the checkout and Unity's Library (`clean` for a fresh checkout and an empty Gradle cache),
# never IL2CPP objects (step il2cppclean, always).
# Concurrency belongs to the caller: a release should have a group of its own per run (never cancelled).
name: Unity Android release

on:
  workflow_call:
    inputs:
      clean:
        description: No caches. Fresh checkout (removes Library and ignored files), empty Gradle cache
        type: boolean
        default: false
      build-runs-on:
        description: JSON array of the labels of the Windows build runner
        type: string
        default: '["self-hosted", "Windows", "runner-windows"]'
      light-runs-on:
        description: JSON array of the labels of the runner of the keystore and notify jobs (any OS)
        type: string
        default: '["light"]'
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEYSTORE_ALIAS:
        required: false
      KEYSTORE_ALIAS_PASSWORD:
        required: false
      GDRIVE_SERVICE_ACCOUNT_KEY:
        required: false
      GDRIVE_FOLDER_ID:
        required: false
      CHAT_WEBHOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  # Release from a tag vX.Y.Z (a push of the tag, or a manual run from it): the store AAB, signed, and one universal
  # APK made from that same AAB for QA, both on Drive. Same runner and workspace as the debug builds.
  release:
    name: Release AAB + APK
    if: github.ref_type == 'tag' && github.actor != 'dependabot[bot]'
    runs-on: ${{ fromJSON(inputs.build-runs-on) }}
    timeout-minutes: 240 # also LIMIT_MINUTES (timeout step)
    # actions: read for the START ETA (the previous successful release, read-only API).
    permissions:
      contents: read
      actions: read
    # What the keystore and notify jobs need.
    outputs:
      timed-out: ${{ steps.timeout.outputs.timed-out }}
      keystore-source: ${{ steps.script.outputs.keystore-source }}
      keystore-committed: ${{ steps.script.outputs.keystore-committed }}
      keystore-path: ${{ steps.script.outputs.keystore-path }}
      keystore-repo-path: ${{ steps.script.outputs.keystore-repo-path }}
      build-start: ${{ steps.start.outputs.time }}
      runner: ${{ runner.name }}
      drive: ${{ steps.meta.outputs.drive }}
      head-sha: ${{ steps.meta.outputs.head-sha }}
      head-subject: ${{ steps.meta.outputs.head-subject }}
      head-author: ${{ steps.meta.outputs.head-author }}
      game-name: ${{ steps.info.outputs.name }}
      version-name: ${{ steps.script.outputs.version-name }}
      version-code: ${{ steps.script.outputs.version-code }}
      log-url: ${{ steps.unitylog.outputs.artifact-url }}
      log-drive-outcome: ${{ steps.drivelog.outcome }}
      log-drive-link: ${{ steps.drivelog.outputs.link }}
      aab-drive-outcome: ${{ steps.driveaab.outcome }}
      aab-drive-link: ${{ steps.driveaab.outputs.link }}
      aab-drive-name: ${{ steps.driveaab.outputs.name }}
      aab-drive-size: ${{ steps.driveaab.outputs.size }}
      aab-url: ${{ steps.aabart.outputs.artifact-url }}
      aab-outcome: ${{ steps.aabart.outcome }}
      apk-drive-outcome: ${{ steps.driveapk.outcome }}
      apk-drive-link: ${{ steps.driveapk.outputs.link }}
      apk-drive-name: ${{ steps.driveapk.outputs.name }}
      apk-drive-size: ${{ steps.driveapk.outputs.size }}
      apk-url: ${{ steps.apkart.outputs.artifact-url }}
      apk-outcome: ${{ steps.apkart.outcome }}
      aab-size: ${{ steps.sizes.outputs.aab }}
      apk-size: ${{ steps.sizes.outputs.apk }}
      prerestore-outcome: ${{ steps.prerestore.outcome }}
      script-outcome: ${{ steps.script.outcome }}
      serial-outcome: ${{ steps.serial.outcome }}
      cleanup-outcome: ${{ steps.cleanup.outcome }}
      il2cppclean-outcome: ${{ steps.il2cppclean.outcome }}
      unity-outcome: ${{ steps.unity.outcome }}
      restore-outcome: ${{ steps.restore.outcome }}
      convert-outcome: ${{ steps.convert.outcome }}
      # Each file exists: on Drive, or else as the fallback artifact.
      aab-ok: ${{ steps.driveaab.outcome == 'success' || steps.aabart.outcome == 'success' }}
      apk-ok: ${{ steps.driveapk.outcome == 'success' || steps.apkart.outcome == 'success' }}
    steps:
      - id: start
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setOutput('time', String(Math.floor(Date.now() / 1000)));

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: ${{ inputs.clean == true }}

      - id: info
        continue-on-error: true
        uses: Association-of-stupid-people/ci-sdk/.github/actions/unity-project-info@22f51ff35adcd10ab01a71f3f8b171a2a08ecca3 # ci-sdk v3.8.0

      # Drive names from the tag, and the head commit for the card.
      - id: meta
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          HAVE_DRIVE: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY != '' && secrets.GDRIVE_FOLDER_ID != '' }}
        with:
          script: |
            const env = process.env;
            const tag = env.REF_NAME.replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'tag';
            const base = `${env.REPO.split('/')[1]}_release_${tag}_${env.RUN_NUMBER}_${env.SHA.slice(0, 7)}`;
            // The notify job builds the same base for the job log.
            core.setOutput('aab-name', `${base}.aab`);
            core.setOutput('apk-name', `${base}.apk`);
            core.setOutput('log-name', `${base}.log`);
            core.setOutput('drive', env.HAVE_DRIVE);
            try {
              const out = require('child_process').execFileSync('git', ['log', '-1', '--format=%H%x00%an%x00%s'], { encoding: 'utf8' });
              const [id, author, subject] = out.trim().split('\0');
              core.setOutput('head-sha', id);
              core.setOutput('head-author', author);
              core.setOutput('head-subject', (subject || '').slice(0, 200));
            } catch {}

      # A segment job killed mid build may leave its generated Adjust file (untracked) behind: never ship it.
      - id: prerestore
        if: inputs.clean != true
        uses: Association-of-stupid-people/ci-sdk/.github/actions/unity-force-segment@22f51ff35adcd10ab01a71f3f8b171a2a08ecca3 # ci-sdk v3.8.0
        with:
          mode: restore

      # Checks the tag (vX.Y.Z) and the keystore before Unity starts, then adds the CI-only build script. Keystore: the
      # secrets when set (unset = empty input), else the one ProjectSettings names, else the one at the project root or
      # committed in the project, else the default branch's (read-only lookup), else a new one (password = its name).
      # This job cannot write: the keystore job commits one that is not on the default branch (keystore-committed false).
      # The project's scripting backend is kept (IL2CPP). No Obfuscar: with `obfuscate: strings` (ci-sdk v3.5.0) the
      # IL2CPP C++ of Assembly-CSharp failed to compile in a game (RuntimeHelpers.InitializeArray signature).
      - id: script
        uses: Association-of-stupid-people/ci-sdk/.github/actions/unity-android-build-script@22f51ff35adcd10ab01a71f3f8b171a2a08ecca3 # ci-sdk v3.8.0
        with:
          version: ${{ github.ref_name }}
          output: Builds/release.aab
          generate-keystore: true
          commit-keystore: false
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          keystore-alias: ${{ secrets.KEYSTORE_ALIAS }}
          keystore-alias-password: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}

      # A keystore that is not on the default branch yet (new, or untracked): attached to the run (7 days) for the keystore
      # job, which commits it, and for whoever commits it by hand if that fails. Also after a cancel: it may have signed.
      - id: keyart
        if: ${{ always() && steps.script.outputs.keystore-committed == 'false' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-keystore
          path: ${{ steps.script.outputs.keystore-path }}
          if-no-files-found: error
          retention-days: 7

      - id: serial
        uses: Association-of-stupid-people/ci-sdk/.github/actions/extract-unity-serial@22f51ff35adcd10ab01a71f3f8b171a2a08ecca3 # ci-sdk v3.8.0
        with:
          license: ${{ secrets.UNITY_LICENSE }}

      # A persistent workspace keeps the files of an earlier release: a failed build must not upload them.
      - id: cleanup
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            require('fs').rmSync('Builds/release.aab', { force: true });
            require('fs').rmSync('Builds/release.apk', { force: true });
            require('fs').rmSync('Builds/unity.log', { force: true });

      # The store build never reuses IL2CPP objects: the same clean as the debug builds, always, and a failed clean fails
      # the release.
      - id: il2cppclean
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ALWAYS: 'true'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = 'Library/Bee/artifacts/Android';
            const marker = 'Library/ci-unity-build-ok';
            // Windows: a file another process still holds (a killed clang, an antivirus scan) fails at once; rmSync does not
            // retry that itself.
            const rm = async p => {
              for (let i = 1; ; i++) {
                try { return fs.rmSync(p, { recursive: true, force: true }); } catch (err) {
                  if (i >= 10 || !['EBUSY', 'EPERM', 'EACCES', 'ENOTEMPTY'].includes(err.code)) throw err;
                  await new Promise(r => setTimeout(r, 1000));
                }
              }
            };
            try {
              const keep = process.env.ALWAYS !== 'true' && fs.existsSync(marker);
              await rm(marker);
              await rm(path.join(root, 'il2cppOutput'));
              core.setOutput('kept', String(keep));
              if (keep) return core.info('The previous Unity build exited normally: IL2CPP objects kept');
              // Object folders of the game's C++ (they hold libil2cpp.so once linked); not the il2cpp.a runtime ones.
              const removed = [];
              for (const e of fs.existsSync(root) ? fs.readdirSync(root, { withFileTypes: true }) : []) {
                if (!e.isDirectory()) continue;
                const files = fs.readdirSync(path.join(root, e.name));
                if (files.includes('libil2cpp.so') || (files.some(f => f.endsWith('.o')) && !files.includes('il2cpp.a'))) {
                  await rm(path.join(root, e.name));
                  removed.push(e.name);
                }
              }
              core.info(`IL2CPP output and objects removed (${removed.join(', ') || 'no object folder'})`);
            } catch (err) {
              // A release never builds on stale objects; a debug build goes on (the next build cleans again).
              if (process.env.ALWAYS === 'true') core.setFailed(`IL2CPP clean failed: ${err.message}`);
              else core.warning(`IL2CPP clean failed, this build may reuse stale IL2CPP objects: ${err.message}`);
            }

      # START message, right before Unity (the tag and the keystore are checked by now).
      - id: startreport
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLEAN: ${{ inputs.clean == true }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.triggering_actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUNNER: ${{ runner.name }}
          BUILD_START: ${{ steps.start.outputs.time }}
          GAME_NAME: ${{ steps.info.outputs.name }}
          VERSION_NAME: ${{ steps.script.outputs.version-name }}
          VERSION_CODE: ${{ steps.script.outputs.version-code }}
          HEAD_SUBJECT: ${{ steps.meta.outputs.head-subject }}
          KEYSTORE_PATH: ${{ steps.script.outputs.keystore-path }}
          HAVE_DRIVE: ${{ steps.meta.outputs.drive }}
          # Only the folder link is built from it, here: a job output holding a secret would be dropped.
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        with:
          script: |
            const env = process.env;
            const repoUrl = `${env.SERVER_URL}/${env.REPO}`;
            const startedAt = new Date((Number(env.BUILD_START) || Date.now() / 1000) * 1000).toLocaleString('en-GB', {
              timeZone: 'Asia/Ho_Chi_Minh', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false,
            }).replace(',', '') + ' (UTC+7)';
            // ETA: the duration of the latest successful release (a vX.Y.Z tag; only a strict one gets past the
            // build-script check), from now, in UTC+7. Best effort: no estimate without one.
            let eta;
            try {
              const { owner, repo } = context.repo;
              const workflow_id = (env.GITHUB_WORKFLOW_REF || '').split('@')[0].split('/').pop();
              const secs = r => (Date.parse(r.updated_at) - Date.parse(r.run_started_at)) / 1000;
              const match = r => ['push', 'workflow_dispatch'].includes(r.event)
                && /^v\d+\.\d+\.\d+$/.test(r.head_branch || '') && secs(r) >= 180;
              let prev, pages = 0;
              // Newest first, at most 5 pages of 100: debug runs far outnumber releases.
              for await (const { data } of github.paginate.iterator(github.rest.actions.listWorkflowRuns, { owner, repo, workflow_id, status: 'success', per_page: 100 })) {
                prev = data.find(match);
                if (prev || ++pages >= 5) break;
              }
              if (prev) {
                const done = new Date(Date.now() + secs(prev) * 1000).toLocaleTimeString('en-GB', {
                  timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit', hour12: false });
                eta = `~${Math.round(secs(prev) / 60)}m (~${done})`;
              }
            } catch (err) {
              core.info(`No ETA: ${err.message}`);
            }
            const report = {
              name: env.REPO.split('/')[1],
              kind: 'release',
              phase: 'start',
              game: env.GAME_NAME || undefined,
              platform: 'Android',
              clean: env.CLEAN === 'true',
              project: { name: env.REPO, url: repoUrl },
              run: { url: `${repoUrl}/actions/runs/${env.RUN_ID}`, number: env.RUN_NUMBER },
              ref: { type: 'tag', name: env.REF_NAME },
              commit: { sha: env.SHA, url: `${repoUrl}/commit/${env.SHA}`, subject: (env.HEAD_SUBJECT || '').split('\n')[0].slice(0, 200) || undefined },
              actor: env.ACTOR,
              event: env.EVENT_NAME,
              runner: env.RUNNER || undefined,
              startedAt,
              eta,
              // The signing key's file name (never a password).
              keystore: (env.KEYSTORE_PATH || '').split(/[\\/]/).pop() || undefined,
              driveFolderUrl: env.HAVE_DRIVE === 'true' && env.GDRIVE_FOLDER_ID ? `https://drive.google.com/drive/folders/${encodeURIComponent(env.GDRIVE_FOLDER_ID)}` : undefined,
              version: { name: env.VERSION_NAME || undefined, code: env.VERSION_CODE || undefined },
              builds: [
                { name: 'AAB', kind: 'aab', status: 'planned' },
                { name: 'APK (universal)', kind: 'apk', status: 'planned' },
              ],
            };
            core.setOutput('json', JSON.stringify(report));

      - if: steps.startreport.outcome == 'success'
        continue-on-error: true
        uses: Association-of-stupid-people/ci-sdk/.github/actions/team-chat@22f51ff35adcd10ab01a71f3f8b171a2a08ecca3 # ci-sdk v3.8.0
        with:
          webhook-url: ${{ secrets.CHAT_WEBHOOK_URL }}
          report: ${{ steps.startreport.outputs.json }}

      # The build script fails Unity (exit code) when the build fails. Keystore values from the secrets reach Unity
      # through the environment only; the ProjectSettings ones are in the script.
      - id: unity
        uses: Association-of-stupid-people/ci-sdk/.github/actions/unity-build@22f51ff35adcd10ab01a71f3f8b171a2a08ecca3 # ci-sdk v3.8.0
        with:
          # Never the BIBG Debug View in a store build: the client posts every analytics event to BIBG and the patched
          # Firebase.Analytics.dll must not ship. Explicitly off (the action also ignores debug-view on a tag), and v3.7.0
          # first removes a client and restores the DLL that a killed debug build left in this persistent workspace.
          debug-view: false
          mode: host
          default-args-override: -batchmode -nographics -silent-crashes -quit -logFile Builds/unity.log -executeMethod ${{ steps.script.outputs.execute-method }}
          args: -buildTarget Android
          timeout: 2h
          clean-gradle-cache: ${{ inputs.clean == true }}
          unity-serial: ${{ steps.serial.outputs.serial }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          keystore-path: ${{ steps.script.outputs.keystore-path }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          keystore-alias: ${{ secrets.KEYSTORE_ALIAS }}
          keystore-alias-password: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}

      - if: always() && steps.unity.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            require('fs').writeFileSync('Library/ci-unity-build-ok', `${process.env.GITHUB_RUN_ID} ${process.env.GITHUB_JOB}\n`);

      # Whatever happened: removes the build script, and the keystore file written from the secrets.
      - id: restore
        if: always() && steps.script.outcome != 'skipped'
        uses: Association-of-stupid-people/ci-sdk/.github/actions/unity-android-build-script@22f51ff35adcd10ab01a71f3f8b171a2a08ecca3 # ci-sdk v3.8.0
        with:
          mode: restore

      # The store file first: it is kept even when the APK step fails. A built AAB is uploaded even when the restore
      # above failed (that fails the job, not the file).
      - id: driveaab
        if: ${{ !cancelled() && steps.unity.outcome == 'success' && steps.meta.outputs.drive == 'true' }}
        continue-on-error: true
        uses: Association-of-stupid-people/ci-sdk/.github/actions/gdrive-upload@22f51ff35adcd10ab01a71f3f8b171a2a08ecca3 # ci-sdk v3.8.0
        with:
          service-account-key: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          folder-id: ${{ secrets.GDRIVE_FOLDER_ID }}
          file: Builds/release.aab
          name: ${{ steps.meta.outputs.aab-name }}

      - id: aabart
        if: ${{ !cancelled() && steps.unity.outcome == 'success' && steps.driveaab.outcome != 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-aab
          path: Builds/release.aab
          if-no-files-found: error
          retention-days: 7

      # That same AAB as one installable APK, signed with the same keystore. java: the OpenJDK of the Unity editor
      # (JAVA_HOME of the machine, if any, is ignored here), the one Unity's Gradle build used.
      - id: convert
        if: ${{ !cancelled() && steps.unity.outcome == 'success' && (steps.driveaab.outcome == 'success' || steps.aabart.outcome == 'success') }}
        # bundletool takes a few minutes: a hung one must not hold the runner for the job's 4 hours.
        timeout-minutes: 30
        uses: Association-of-stupid-people/ci-sdk/.github/actions/aab-to-apk@22f51ff35adcd10ab01a71f3f8b171a2a08ecca3 # ci-sdk v3.8.0
        env:
          JAVA_HOME: ''
        with:
          aab: Builds/release.aab
          output: Builds/release.apk
          editor-path: ${{ steps.unity.outputs.editor-path }}
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          keystore-alias: ${{ secrets.KEYSTORE_ALIAS }}
          keystore-alias-password: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}

      - id: driveapk
        if: ${{ !cancelled() && steps.convert.outcome == 'success' && steps.meta.outputs.drive == 'true' }}
        continue-on-error: true
        uses: Association-of-stupid-people/ci-sdk/.github/actions/gdrive-upload@22f51ff35adcd10ab01a71f3f8b171a2a08ecca3 # ci-sdk v3.8.0
        with:
          service-account-key: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          folder-id: ${{ secrets.GDRIVE_FOLDER_ID }}
          file: Builds/release.apk
          name: ${{ steps.meta.outputs.apk-name }}

      - id: apkart
        if: ${{ !cancelled() && steps.convert.outcome == 'success' && steps.driveapk.outcome != 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: Builds/release.apk
          if-no-files-found: error
          retention-days: 7

      # Bytes of each built file for the card (the cleanup step removed the earlier ones). Empty when missing.
      - id: sizes
        if: ${{ !cancelled() && steps.unity.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            for (const [key, file] of [['aab', 'Builds/release.aab'], ['apk', 'Builds/release.apk']]) {
              if (fs.existsSync(file)) core.setOutput(key, String(fs.statSync(file).size));
            }

      # The Unity log next to the AAB and APK on Drive, whatever happened.
      - id: drivelog
        if: always() && steps.unity.outcome != 'skipped' && steps.meta.outputs.drive == 'true' && hashFiles('Builds/unity.log') != ''
        continue-on-error: true
        uses: Association-of-stupid-people/ci-sdk/.github/actions/gdrive-upload@22f51ff35adcd10ab01a71f3f8b171a2a08ecca3 # ci-sdk v3.8.0
        with:
          service-account-key: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          folder-id: ${{ secrets.GDRIVE_FOLDER_ID }}
          file: Builds/unity.log
          name: ${{ steps.meta.outputs.log-name }}

      # Only when Unity itself failed and its log is not on Drive: the card links it as the Unity log.
      - id: unitylog
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.unity.outcome == 'failure' && steps.drivelog.outcome != 'success'
        with:
          name: release-unity-log
          path: Builds/unity.log
          retention-days: 7

      # The job's own timeout-minutes shows as cancelled too (job.status, needs.<job>.result): a job stopped within
      # 3 minutes of its limit timed out, a failure the notify job reports as one.
      - id: timeout
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          JOB_STATUS: ${{ job.status }}
          START: ${{ steps.start.outputs.time }}
          LIMIT_MINUTES: 240
        with:
          script: |
            const ranFor = process.env.START ? Date.now() / 1000 - Number(process.env.START) : 0;
            core.setOutput('timed-out', String(process.env.JOB_STATUS === 'cancelled' && ranFor >= Number(process.env.LIMIT_MINUTES) * 60 - 180));

  # Commits the keystore the release job used when it is not on the default branch yet (generated, or untracked; that
  # job has no write access): the workflow's only write. It runs whatever happened to the release (always()), so such a
  # key is never lost. The same key already there counts as committed; a different one there fails this job: the
  # release was signed with another key and must not be uploaded (the card says so).
  keystore:
    name: Commit the release keystore
    needs: release
    if: ${{ always() && needs.release.outputs.keystore-committed == 'false' }}
    runs-on: ${{ fromJSON(inputs.light-runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      conflict: ${{ steps.commit.outputs.conflict }}
    steps:
      # A fresh folder: the runner's workspace persists between jobs.
      - id: dirs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TEMP_DIR: ${{ runner.temp }}
        with:
          script: |
            const dir = require('path').join(process.env.TEMP_DIR, `keystore-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`);
            require('fs').rmSync(dir, { recursive: true, force: true });
            core.setOutput('dir', dir);

      - id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-keystore
          path: ${{ steps.dirs.outputs.dir }}

      # Every keystore of the default branch (trees API), as the build-script action checked it hours ago: the same file
      # anywhere is fine, any other keystore fails (another key may have been merged meanwhile), none → the file is
      # created through the contents API (retried when the branch moves under the request).
      - id: commit
        if: always() && steps.dirs.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          KEY_DIR: ${{ steps.dirs.outputs.dir }}
          REPO_PATH: ${{ needs.release.outputs.keystore-repo-path }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const { KEY_DIR, REPO_PATH } = process.env;
            core.setOutput('committed', 'false');
            core.setOutput('conflict', 'false');
            // A release keystore path: *.keystore / *.jks in any case, never an Android debug keystore.
            const isKey = p => /\.(keystore|jks)$/i.test(p) && path.posix.basename(p).toLowerCase() !== 'debug.keystore';
            const files = fs.existsSync(KEY_DIR) ? fs.readdirSync(KEY_DIR).filter(isKey) : [];
            if (!REPO_PATH || !isKey(REPO_PATH) || files.length !== 1) {
              core.setFailed(`No keystore to commit (artifact release-keystore: ${files.length} file(s), repository path "${REPO_PATH}")`);
              return;
            }
            const bytes = fs.readFileSync(path.join(KEY_DIR, files[0]));
            // Git's blob id: what the trees API lists.
            const sha = crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            const { owner, repo } = context.repo;
            try {
              const { data: info } = await github.rest.repos.get({ owner, repo });
              const branch = info.default_branch;
              const keysOnBranch = async () => {
                const { data } = await github.rest.git.getTree({ owner, repo, tree_sha: branch, recursive: 'true' });
                if (data.truncated) throw new Error(`the files of ${branch} cannot be listed in one API call (too many)`);
                return data.tree.filter(e => e.type === 'blob' && isKey(e.path));
              };
              let refused = '';
              for (let attempt = 1; attempt <= 3; attempt++) {
                const keys = await keysOnBranch();
                const same = keys.find(e => e.sha === sha);
                if (same) {
                  core.info(`${branch} already has this keystore (${same.path})`);
                  core.setOutput('committed', 'true');
                  return;
                }
                if (keys.length) {
                  core.setOutput('conflict', 'true');
                  core.setFailed(`${branch} already has another keystore (${keys.map(e => e.path).join(', ')}): this release was signed with a different key. Do not upload it; release again, it signs with the committed key`);
                  return;
                }
                try {
                  const { data } = await github.rest.repos.createOrUpdateFileContents({
                    owner, repo, path: REPO_PATH, branch,
                    message: `chore: add the release keystore ${path.posix.basename(REPO_PATH)} (committed by CI)`,
                    content: bytes.toString('base64'),
                  });
                  core.info(`Committed ${REPO_PATH} to ${branch}: ${data.commit.html_url}`);
                  core.setOutput('committed', 'true');
                  return;
                } catch (err) {
                  if (err.status !== 409 && err.status !== 422) throw err;
                  refused = `HTTP ${err.status}: ${err.message}`;
                  core.info(`${refused} (try ${attempt} of 3): checking ${branch} again`);
                }
              }
              core.setFailed(`${REPO_PATH} could not be committed to ${branch} after 3 tries (${refused}): commit it yourself (run artifact release-keystore, 7 days)`);
            } catch (err) {
              core.setFailed(`${REPO_PATH} could not be committed: ${err.message}. Commit it yourself (run artifact release-keystore, 7 days)`);
            }

  # The END message of the release: success, partial, failure or cancelled. It also runs when the run is cancelled
  # (always()): the result of each job comes from needs.<job>.result.
  notify:
    name: Drive and chat
    needs: [release, keystore]
    if: ${{ always() && needs.release.result != 'skipped' }}
    # The light runner: the END message does not wait behind builds on the Windows build runner. Every step is
    # OS-independent (github-script, team-chat).
    runs-on: ${{ fromJSON(inputs.light-runs-on) }}
    timeout-minutes: 30
    # actions: read for the job logs and the run's start (read-only API).
    permissions:
      contents: read
      actions: read
    env:
      # From the secrets, not from the build job: a job cancelled while it waited for the runner has no outputs.
      HAVE_DRIVE: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY != '' && secrets.GDRIVE_FOLDER_ID != '' }}
    # Every step runs whatever happened before it (always()): the END message must go out.
    steps:
      # A fresh folder: the runner's workspace persists between jobs.
      - id: dirs
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TEMP_DIR: ${{ runner.temp }}
        with:
          script: |
            const dir = require('path').join(process.env.TEMP_DIR, `notify-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`);
            require('fs').rmSync(dir, { recursive: true, force: true });
            core.setOutput('dir', dir);

      - if: always() && env.HAVE_DRIVE != 'true'
        run: echo "::warning::GDRIVE_SERVICE_ACCOUNT_KEY or GDRIVE_FOLDER_ID is empty, the builds were not uploaded to Drive (they are GitHub artifacts)"

      # Which built files did not reach Drive (the release job uploads them; a failed upload fails the run here).
      - id: drivecheck
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_AAB_DRIVE_OUTCOME: ${{ needs.release.outputs.aab-drive-outcome }}
          RELEASE_AAB_OUTCOME: ${{ needs.release.outputs.aab-outcome }}
          RELEASE_APK_DRIVE_OUTCOME: ${{ needs.release.outputs.apk-drive-outcome }}
          RELEASE_APK_OUTCOME: ${{ needs.release.outputs.apk-outcome }}
        with:
          script: |
            const env = process.env;
            const failed = [];
            if (env.RELEASE_AAB_DRIVE_OUTCOME === 'failure' && env.RELEASE_AAB_OUTCOME === 'success') failed.push('release AAB');
            if (env.RELEASE_APK_DRIVE_OUTCOME === 'failure' && env.RELEASE_APK_OUTCOME === 'success') failed.push('release APK');
            core.setOutput('failed', failed.join(', '));

      # The full GitHub log of the release job and the keystore job when they failed or were cancelled, as one file for
      # Drive: where the Unity log does not help (checkout, keystore, aab-to-apk, upload, a killed Unity). Also each
      # job's page, the card's GitHub fallback. Best effort: a problem here is a warning, never the run's result.
      - id: joblog
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIR: ${{ steps.dirs.outputs.dir }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const env = process.env;
            const { owner, repo } = context.repo;
            // Called as a reusable workflow, a job is listed as "<caller job> / <job name>".
            const short = n => { const i = n.indexOf(' / '); return i < 0 ? n : n.slice(i + 3); };
            const isBuildJob = n => ['Release AAB + APK', 'Commit the release keystore'].includes(n);
            let jobs;
            try {
              jobs = (await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                { owner, repo, run_id: context.runId, filter: 'latest', per_page: 100 }))
                .map(j => ({ ...j, name: short(j.name) })).filter(j => isBuildJob(j.name));
            } catch (err) {
              core.warning(`Jobs of the run not listed, no job log on Drive: ${err.message}`);
              return;
            }
            core.setOutput('urls', JSON.stringify(Object.fromEntries(jobs.map(j => [j.name, j.html_url]))));
            if (env.HAVE_DRIVE !== 'true') return;
            // Named like the build files (meta step of the release job, which may not have run).
            const tag = env.REF_NAME.replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'tag';
            const name = `${env.REPO.split('/')[1]}_release_${tag}_${env.RUN_NUMBER}_${env.SHA.slice(0, 7)}-job.log`;
            // A job that never got a runner has no steps and no log.
            const stopped = jobs.filter(j => ['failure', 'cancelled', 'timed_out'].includes(j.conclusion) && (j.steps || []).length);
            const parts = [];
            const included = [];
            for (const j of stopped) {
              let text;
              // The log can lag a few seconds behind the job's end.
              for (let i = 1; i <= 3 && text === undefined; i++) {
                try {
                  const { data } = await github.rest.actions.downloadJobLogsForWorkflowRun({ owner, repo, job_id: j.id });
                  text = typeof data === 'string' ? data : Buffer.from(data).toString('utf8');
                } catch (err) {
                  core.info(`${j.name}: job log not available (try ${i} of 3): ${err.message}`);
                  if (i < 3) await new Promise(r => setTimeout(r, 15000));
                }
              }
              if (text === undefined) {
                core.warning(`${j.name}: job log not downloaded, the card links its GitHub page`);
                continue;
              }
              parts.push(`===== ${j.name}: ${j.conclusion} (${j.html_url}) =====\n${text}\n`);
              included.push(j.name);
            }
            if (!parts.length) return;
            fs.mkdirSync(env.DIR, { recursive: true });
            const file = path.join(env.DIR, name);
            fs.writeFileSync(file, parts.join('\n'));
            core.setOutput('file', file);
            core.setOutput('name', name);
            core.setOutput('jobs', JSON.stringify(included));

      - id: drivejoblog
        if: always() && env.HAVE_DRIVE == 'true' && steps.joblog.outputs.file != ''
        continue-on-error: true
        uses: Association-of-stupid-people/ci-sdk/.github/actions/gdrive-upload@22f51ff35adcd10ab01a71f3f8b171a2a08ecca3 # ci-sdk v3.8.0
        with:
          service-account-key: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          folder-id: ${{ secrets.GDRIVE_FOLDER_ID }}
          file: ${{ steps.joblog.outputs.file }}
          name: ${{ steps.joblog.outputs.name }}

      # The run report for the END message; ci-sdk team-chat turns it into the card. Everything from the event is
      # untrusted text: it reaches the script only through env, and team-chat escapes it (no mention, no link).
      - id: report
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
          # Only the folder link is built from it, here: a job output holding a secret would be dropped.
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          REL_TIMED_OUT: ${{ needs.release.outputs.timed-out }}
          REL_KEYSTORE_SOURCE: ${{ needs.release.outputs.keystore-source }}
          REL_KEYSTORE_COMMITTED: ${{ needs.release.outputs.keystore-committed }}
          REL_KEYSTORE_PATH: ${{ needs.release.outputs.keystore-path }}
          KEYSTORE_COMMITTED: ${{ needs.keystore.outputs.committed }}
          KEYSTORE_CONFLICT: ${{ needs.keystore.outputs.conflict }}
          EVENT_NAME: ${{ github.event_name }}
          CLEAN: ${{ inputs.clean == true }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.triggering_actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_IDS: ${{ toJSON(github.event.commits.*.id) }}
          COMMIT_MESSAGES: ${{ toJSON(github.event.commits.*.message) }}
          COMMIT_AUTHORS: ${{ toJSON(github.event.commits.*.author.name) }}
          HEAD_SHA: ${{ needs.release.outputs.head-sha }}
          HEAD_SUBJECT: ${{ needs.release.outputs.head-subject }}
          HEAD_AUTHOR: ${{ needs.release.outputs.head-author }}
          BUILD_START: ${{ needs.release.outputs.build-start }}
          RUNNER: ${{ needs.release.outputs.runner }}
          GAME_NAME: ${{ needs.release.outputs.game-name }}
          GAME_VERSION: ${{ needs.release.outputs.version-name }}
          VERSION_CODE: ${{ needs.release.outputs.version-code }}
          DRIVE_FAILED: ${{ steps.drivecheck.outputs.failed }}
          REL_LOG_URL: ${{ needs.release.outputs.log-url }}
          REL_LOG_DRIVE_OUTCOME: ${{ needs.release.outputs.log-drive-outcome }}
          REL_LOG_DRIVE_LINK: ${{ needs.release.outputs.log-drive-link }}
          JOB_LOG_JOBS: ${{ steps.joblog.outputs.jobs }}
          JOB_URLS: ${{ steps.joblog.outputs.urls }}
          JOB_LOG_DRIVE_OUTCOME: ${{ steps.drivejoblog.outcome }}
          JOB_LOG_LINK: ${{ steps.drivejoblog.outputs.link }}
          REL_AAB_OK: ${{ needs.release.outputs.aab-ok }}
          REL_AAB_SIZE: ${{ needs.release.outputs.aab-size }}
          REL_APK_SIZE: ${{ needs.release.outputs.apk-size }}
          REL_AAB_URL: ${{ needs.release.outputs.aab-url }}
          REL_AAB_DRIVE_LINK: ${{ needs.release.outputs.aab-drive-link }}
          REL_AAB_DRIVE_SIZE: ${{ needs.release.outputs.aab-drive-size }}
          REL_AAB_DRIVE_OUTCOME: ${{ needs.release.outputs.aab-drive-outcome }}
          REL_AAB_OUTCOME: ${{ needs.release.outputs.aab-outcome }}
          REL_APK_OK: ${{ needs.release.outputs.apk-ok }}
          REL_APK_URL: ${{ needs.release.outputs.apk-url }}
          REL_APK_DRIVE_LINK: ${{ needs.release.outputs.apk-drive-link }}
          REL_APK_DRIVE_SIZE: ${{ needs.release.outputs.apk-drive-size }}
          REL_APK_DRIVE_OUTCOME: ${{ needs.release.outputs.apk-drive-outcome }}
          REL_APK_OUTCOME: ${{ needs.release.outputs.apk-outcome }}
          REL_PRERESTORE_OUTCOME: ${{ needs.release.outputs.prerestore-outcome }}
          REL_SCRIPT_OUTCOME: ${{ needs.release.outputs.script-outcome }}
          REL_SERIAL_OUTCOME: ${{ needs.release.outputs.serial-outcome }}
          REL_CLEANUP_OUTCOME: ${{ needs.release.outputs.cleanup-outcome }}
          REL_IL2CPPCLEAN_OUTCOME: ${{ needs.release.outputs.il2cppclean-outcome }}
          REL_UNITY_OUTCOME: ${{ needs.release.outputs.unity-outcome }}
          REL_RESTORE_OUTCOME: ${{ needs.release.outputs.restore-outcome }}
          REL_CONVERT_OUTCOME: ${{ needs.release.outputs.convert-outcome }}
        with:
          script: |
            const env = process.env;
            const first = s => (s || '').split('\n')[0].trim().slice(0, 200);
            const parse = (s, fallback) => { try { return JSON.parse(s || ''); } catch { return fallback; } };
            const num = s => (s === undefined || s === '' || !Number.isFinite(Number(s)) ? undefined : Number(s));

            const repoUrl = `${env.SERVER_URL}/${env.REPO}`;
            const sha = env.SHA;
            // needs.release.result: success, failure or cancelled. The release job tells its own timeout-minutes apart
            // (its timeout step): a failure.
            const releaseTimedOut = env.RELEASE_RESULT === 'cancelled' && env.REL_TIMED_OUT === 'true';
            // A release signed with a new key while the default branch got another one (the keystore job): unusable.
            const keystoreConflict = env.KEYSTORE_CONFLICT === 'true';
            // A keystore that signed this release but is still not on the default branch: the next one may differ.
            const keystoreUncommitted = !keystoreConflict && env.REL_KEYSTORE_COMMITTED === 'false' && env.KEYSTORE_COMMITTED !== 'true';
            const releaseResult = releaseTimedOut || (keystoreConflict && env.RELEASE_RESULT === 'success') ? 'failure' : env.RELEASE_RESULT;
            const jobs = { release: releaseResult };
            const cancelled = releaseResult === 'cancelled';

            const driveOn = env.HAVE_DRIVE === 'true';
            const uploadFailed = !!env.DRIVE_FAILED;
            const mainOk = releaseResult === 'success';
            const ok = mainOk && !uploadFailed && !keystoreUncommitted;
            // The stage a stopped job was in: its first step whose outcome is cancelled. A job with no start time never
            // got the runner.
            const stage = pairs => (pairs.find(([outcome]) => outcome === 'cancelled') || [])[1];
            const started = !!env.BUILD_START;
            const releaseStage = () => stage([
              [env.REL_PRERESTORE_OUTCOME, 'Segment restore (before build)'], [env.REL_SCRIPT_OUTCOME, 'Release setup'],
              [env.REL_SERIAL_OUTCOME, 'Unity license (serial)'], [env.REL_CLEANUP_OUTCOME, 'Cleanup of the old build'],
              [env.REL_IL2CPPCLEAN_OUTCOME, 'IL2CPP clean'], [env.REL_UNITY_OUTCOME, 'Unity build (AAB)'], [env.REL_RESTORE_OUTCOME, 'Build script restore'],
              [env.REL_AAB_DRIVE_OUTCOME, 'Upload of the AAB to Drive'], [env.REL_AAB_OUTCOME, 'AAB artifact'],
              [env.REL_CONVERT_OUTCOME, 'AAB to APK'], [env.REL_APK_DRIVE_OUTCOME, 'Upload of the APK to Drive'],
              [env.REL_APK_OUTCOME, 'APK artifact'],
            ]) || (started ? 'the release job' : 'the wait for the runner');
            // In step order.
            const releaseFailedStep = releaseTimedOut ? `${releaseStage()} (timed out)`
              : env.REL_PRERESTORE_OUTCOME === 'failure' ? 'Segment restore (before build)'
              : env.REL_SCRIPT_OUTCOME === 'failure' ? 'Release setup (tag vX.Y.Z or keystore)'
              : env.REL_SERIAL_OUTCOME === 'failure' ? 'Unity license (serial)'
              : env.REL_CLEANUP_OUTCOME === 'failure' ? 'Cleanup of the old build'
              : env.REL_IL2CPPCLEAN_OUTCOME === 'failure' ? 'IL2CPP clean (Library/Bee files locked?)'
              : env.REL_UNITY_OUTCOME === 'failure' ? 'Unity build'
              : env.REL_RESTORE_OUTCOME === 'failure' ? 'Build script restore'
              : env.REL_AAB_OUTCOME === 'failure' ? 'AAB missing'
              : env.REL_CONVERT_OUTCOME === 'failure' ? 'AAB to APK'
              : env.REL_APK_OUTCOME === 'failure' ? 'APK missing'
              : keystoreConflict ? 'Keystore commit (the default branch has another key)'
              : 'unknown step';
            const cancelStage = cancelled ? releaseStage() : '';

            // The run's start for a cancelled run (read-only API). A release is never replaced by a newer run. Best
            // effort: without it the message leaves the duration out.
            let runStarted;
            if (cancelled) {
              try {
                const { owner, repo } = context.repo;
                const { data: me } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(env.RUN_ID) });
                runStarted = Math.floor(Date.parse(me.run_started_at) / 1000) || undefined;
              } catch (err) {
                core.info(`Run details not available: ${err.message}`);
              }
            }

            // The log of a failed build: its Unity log on Drive when Unity is where it failed, else the job's full log on
            // Drive (joblog step), else GitHub: the Unity log artifact, else the job's page.
            const jobLogJobs = parse(env.JOB_LOG_JOBS, []);
            const jobUrls = parse(env.JOB_URLS, {});
            const logFor = (job, unityDrive, artifactUrl) => unityDrive
              || (env.JOB_LOG_LINK && Array.isArray(jobLogJobs) && jobLogJobs.includes(job) ? env.JOB_LOG_LINK : '')
              || artifactUrl || jobUrls?.[job] || undefined;
            // A release that built but whose keystore commit failed or conflicts: the keystore job's log.
            const logUrl = env.RELEASE_RESULT === 'success' && (keystoreConflict || keystoreUncommitted)
              ? logFor('Commit the release keystore', '', '')
              : logFor('Release AAB + APK', releaseFailedStep === 'Unity build' ? env.REL_LOG_DRIVE_LINK : '', env.REL_LOG_URL);
            const logUploadsFailed = [
              ...(env.REL_LOG_DRIVE_OUTCOME === 'failure' ? ['release Unity log'] : []),
              ...(env.JOB_LOG_DRIVE_OUTCOME === 'failure' ? ['job log'] : []),
            ];
            if (logUploadsFailed.length) core.warning(`Log upload to Drive failed (${logUploadsFailed.join(', ')}): the card links the next log available (job log on Drive, else GitHub)`);
            // A built file: its Drive link, else the fallback artifact. A missing one: why, and the log.
            // size: bytes of the built file (measured by the build job), else what Drive reported.
            const linkOf = (driveLink, size, artifactUrl) => driveLink ? { link: driveLink, size: num(size) }
              : artifactUrl ? { link: artifactUrl, fallback: true, size: num(size) } : {};
            const built = (ok, stopped, driveLink, size, artifactUrl, why, log) => ok
              ? { status: 'success', ...linkOf(driveLink, size, artifactUrl) }
              : stopped ? { status: 'cancelled' } : { status: 'failure', failedStep: why, logUrl: log };
            const builds = [
              // An AAB signed with a key the default branch does not have is not a store build: no link.
              { name: 'AAB', kind: 'aab', ...built(env.REL_AAB_OK === 'true' && !keystoreConflict, cancelled, env.REL_AAB_DRIVE_LINK, env.REL_AAB_SIZE || env.REL_AAB_DRIVE_SIZE, env.REL_AAB_URL, keystoreConflict ? 'Keystore commit (the default branch has another key)' : releaseFailedStep, logUrl) },
              { name: 'APK', kind: 'apk', ...built(env.REL_APK_OK === 'true', cancelled, env.REL_APK_DRIVE_LINK, env.REL_APK_SIZE || env.REL_APK_DRIVE_SIZE, env.REL_APK_URL, releaseFailedStep, logUrl) },
            ];

            const failedStep = cancelled ? cancelStage
              : !mainOk ? releaseFailedStep
              : uploadFailed ? `Upload to Drive (${env.DRIVE_FAILED})`
              : keystoreUncommitted ? 'Keystore commit' : 'unknown step';

            let changes = [];
            if (env.EVENT_NAME === 'push') {
              const ids = parse(env.COMMIT_IDS, []), msgs = parse(env.COMMIT_MESSAGES, []), names = parse(env.COMMIT_AUTHORS, []);
              changes = ids.map((id, i) => ({ sha: id, subject: first(msgs[i]), author: names[i] }));
            }
            if (!changes.length && env.HEAD_SHA) changes = [{ sha: env.HEAD_SHA, subject: first(env.HEAD_SUBJECT), author: env.HEAD_AUTHOR }];

            // A release keystore that did not come from this commit: generated or untracked (committed by the keystore job
            // or not), or from the default branch.
            const keyFile = (env.REL_KEYSTORE_PATH || '').split(/[\\/]/).pop() || 'the keystore';
            const generatedKey = env.REL_KEYSTORE_SOURCE === 'generated';
            const keystoreNotes = keystoreConflict
                ? [`🔑 The default branch already has another ${keyFile}: this release is signed with a different key. Do not upload it; release again`]
              : env.REL_KEYSTORE_COMMITTED === 'false' && env.KEYSTORE_COMMITTED === 'true'
                ? [generatedKey
                  ? `🔑 New release keystore ${keyFile} (password = its name), committed to the default branch: every later release signs with it`
                  : `🔑 ${keyFile} was not in git (left on the runner by an earlier run?): now committed to the default branch, every later release signs with it`]
              : env.REL_KEYSTORE_COMMITTED === 'false'
                ? [`🔑 ${generatedKey ? `New release keystore ${keyFile}` : `${keyFile} (not in git)`} was NOT committed: commit it before the next release (run artifact release-keystore, 7 days), or that release signs with another key`]
              : env.REL_KEYSTORE_SOURCE === 'default-branch'
                ? [`🔑 ${keyFile} was taken from the default branch: this tag's commit does not have it`]
              : [];

            // From the build job's start; for a run cancelled before the job started, from the run's start.
            const start = Number(env.BUILD_START) || runStarted;
            const secs = start ? Math.round(Date.now() / 1000) - start : undefined;
            const startedAt = start ? new Date(start * 1000).toLocaleString('en-GB', {
              timeZone: 'Asia/Ho_Chi_Minh', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false,
            }).replace(',', '') + ' (UTC+7)' : undefined;
            const report = {
              name: env.REPO.split('/')[1],
              kind: 'release',
              phase: 'end',
              status: cancelled ? 'cancelled' : ok ? 'success' : 'failure',
              jobs,
              ...(ok && !cancelled ? {} : { failedStep }),
              game: env.GAME_NAME || undefined,
              platform: 'Android',
              clean: env.CLEAN === 'true',
              project: { name: env.REPO, url: repoUrl },
              run: { url: `${repoUrl}/actions/runs/${env.RUN_ID}`, number: env.RUN_NUMBER },
              ref: { type: 'tag', name: env.REF_NAME },
              commit: { sha, url: `${repoUrl}/commit/${sha}`, subject: first(env.HEAD_SUBJECT) || undefined },
              actor: env.ACTOR,
              event: env.EVENT_NAME,
              runner: env.RUNNER || undefined,
              startedAt,
              durationSeconds: secs !== undefined && Number.isFinite(secs) ? Math.max(0, secs) : undefined,
              // The signing key's file name (never a password).
              keystore: env.REL_KEYSTORE_PATH ? keyFile : undefined,
              driveFolderUrl: driveOn && env.GDRIVE_FOLDER_ID ? `https://drive.google.com/drive/folders/${encodeURIComponent(env.GDRIVE_FOLDER_ID)}` : undefined,
              version: { name: env.GAME_VERSION ? env.GAME_VERSION.replace(/^v?/i, 'v') : undefined, code: env.VERSION_CODE && env.VERSION_CODE !== '?' ? env.VERSION_CODE : undefined },
              builds,
              changelog: changes.map(c => ({ ...c, url: `${repoUrl}/commit/${c.sha}` })),
              warnings: [
                ...(driveOn ? [] : ['Drive chưa cấu hình: GDRIVE_SERVICE_ACCOUNT_KEY or GDRIVE_FOLDER_ID is empty, the files are GitHub artifacts (7 days)']),
                ...keystoreNotes,
              ],
              logUrl,
            };
            core.setOutput('json', JSON.stringify(report));

      # Header, fields, one table row per build, alerts, changelog. A webhook error is only a warning: team-chat
      # never fails the run for it.
      - if: always() && steps.report.outcome == 'success'
        continue-on-error: true
        uses: Association-of-stupid-people/ci-sdk/.github/actions/team-chat@22f51ff35adcd10ab01a71f3f8b171a2a08ecca3 # ci-sdk v3.8.0
        with:
          webhook-url: ${{ secrets.CHAT_WEBHOOK_URL }}
          report: ${{ steps.report.outputs.json }}

      - if: always() && steps.drivecheck.outputs.failed != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FAILED: ${{ steps.drivecheck.outputs.failed }}
        with:
          script: |
            core.setFailed(`Drive upload failed for: ${process.env.FAILED} (see the drive step of that build job)`);
