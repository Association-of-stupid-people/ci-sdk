# Builds every action and publishes it to the `runner` branch as
# .github/actions/<name>/{action.yml,dist/index.js}, which is what workflows use:
#   uses: <owner>/sdk/.github/actions/<name>@runner
#
# Replaces the old build.yml (template submodule + ncc + rsync). Only the
# folders of the JS actions built here are replaced; composite actions and
# workflows on the runner branch are left untouched.
name: Publish actions

on:
  push:
    branches: [actions]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-runner-branch
  cancel-in-progress: false # never cancel a half-finished publish

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actions-dist
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write # push to the runner branch; only this job has it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: actions-dist
          # Fresh dir: self-hosted workspaces persist, stale files must not be published.
          path: ${{ runner.temp }}/actions-dist

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: runner
          path: runner-branch
          clean: true

      - name: Sync built actions into the runner branch
        env:
          DIST: ${{ runner.temp }}/actions-dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=("$DIST"/*/)
          if [ ${#dirs[@]} -eq 0 ]; then echo "::error::artifact is empty"; exit 1; fi
          for dir in "${dirs[@]}"; do
            name=$(basename "$dir")
            target="runner-branch/.github/actions/$name"
            rm -rf "$target"
            mkdir -p "$target"
            cp -R "$dir". "$target/"
            echo "synced $name"
          done

      - name: Commit and push if changed
        working-directory: runner-branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/actions
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "build: update JS actions from ${SOURCE_SHA::7}"
          # Someone may have committed to runner meanwhile: rebase and retry, bounded.
          for i in 1 2 3; do
            git push origin HEAD:runner && exit 0
            git pull --rebase origin runner
          done
          exit 1
