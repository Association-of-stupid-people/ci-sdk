# Builds every action and publishes it to the `runner` branch as
# .github/actions/<name>/{action.yml,dist/index.js}, which is what workflows use:
#   uses: <owner>/ci-sdk/.github/actions/<name>@runner
# then the reusable workflows of workflows/ as .github/workflows/<name>.yml, with
# every ci-sdk action they use pinned to the runner commit that holds the actions
# just published (two commits: the actions, then the workflows). A game pins a
# workflow to the runner head after the publish:
#   uses: <owner>/ci-sdk/.github/workflows/<name>.yml@<runner sha> # ci-sdk vX.Y.Z
#
# Replaces the old build.yml (template submodule + ncc + rsync). Only the
# folders of the JS actions built here and the workflow files of workflows/ are
# replaced; composite actions and other files on the runner branch are left
# untouched.
name: Publish actions

on:
  push:
    branches: [actions]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-runner-branch
  cancel-in-progress: false # never cancel a half-finished publish

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actions-dist
          path: dist/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reusable-workflows
          path: workflows/*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write # push to the runner branch; only this job has it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: actions-dist
          # Fresh dir: self-hosted workspaces persist, stale files must not be published.
          path: ${{ runner.temp }}/actions-dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reusable-workflows
          path: ${{ runner.temp }}/reusable-workflows

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: runner
          path: runner-branch
          clean: true

      - name: Sync built actions into the runner branch
        env:
          DIST: ${{ runner.temp }}/actions-dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=("$DIST"/*/)
          if [ ${#dirs[@]} -eq 0 ]; then echo "::error::artifact is empty"; exit 1; fi
          for dir in "${dirs[@]}"; do
            name=$(basename "$dir")
            target="runner-branch/.github/actions/$name"
            rm -rf "$target"
            mkdir -p "$target"
            cp -R "$dir". "$target/"
            echo "synced $name"
          done

      - name: Commit and push the actions if changed
        id: actions
        working-directory: runner-branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/actions
          if git diff --cached --quiet; then
            echo "No action changes to publish"
          else
            git commit -m "build: update JS actions from ${SOURCE_SHA::7}"
            # Someone may have committed to runner meanwhile: rebase and retry, bounded.
            pushed=false
            for i in 1 2 3; do
              if git push origin HEAD:runner; then pushed=true; break; fi
              git pull --rebase origin runner
            done
            [ "$pushed" = true ] || exit 1
          fi
          # The runner commit that holds the actions as published now: what the workflows pin.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pin and commit the reusable workflows
        working-directory: runner-branch
        env:
          SRC: ${{ runner.temp }}/reusable-workflows
          SOURCE_SHA: ${{ github.sha }}
          ACTIONS_SHA: ${{ steps.actions.outputs.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$SRC"/*.yml)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no reusable workflow in the artifact"; exit 1; fi
          case "$ACTIONS_SHA" in [0-9a-f]*) ;; *) echo "::error::no actions commit sha"; exit 1 ;; esac
          mkdir -p .github/workflows
          for f in "${files[@]}"; do
            target=".github/workflows/$(basename "$f")"
            sed -E "s#(Association-of-stupid-people/ci-sdk/\.github/actions/[a-z0-9-]+)@runner( .*)?\$#\1@${ACTIONS_SHA} \# ci-sdk v${VERSION}#" "$f" > "$target"
            if grep -nE 'ci-sdk/\.github/actions/[a-z0-9-]+@runner' "$target"; then
              echo "::error::$target still uses an unpinned ci-sdk action"; exit 1
            fi
            echo "pinned $target to $ACTIONS_SHA"
          done
          git add .github/workflows
          if git diff --cached --quiet; then
            echo "No workflow changes to publish"
            exit 0
          fi
          git commit -m "build: update reusable workflows from ${SOURCE_SHA::7} (actions ${ACTIONS_SHA::7})"
          for i in 1 2 3; do
            git push origin HEAD:runner && exit 0
            git pull --rebase origin runner
          done
          exit 1
