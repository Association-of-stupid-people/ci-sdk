# Builds every action and publishes it to the `runner` branch as
# .github/actions/<name>/{action.yml,dist/index.js}, which is what workflows use:
#   uses: <owner>/ci-sdk/.github/actions/<name>@runner
# then the reusable workflows of workflows/ as .github/workflows/<name>.yml, with
# every ci-sdk action they use pinned to the runner commit that holds the actions
# just published (two commits: the actions, then the workflows). A game pins a
# workflow to the runner head after the publish:
#   uses: <owner>/ci-sdk/.github/workflows/<name>.yml@<runner sha> # ci-sdk vX.Y.Z
#
# Replaces the old build.yml (template submodule + ncc + rsync). Only the
# folders of the JS actions built here and the workflow files of workflows/ are
# replaced; composite actions and other files on the runner branch are left
# untouched.
name: Publish actions

on:
  push:
    branches: [actions]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-runner-branch
  cancel-in-progress: false # never cancel a half-finished publish

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actions-dist
          path: dist/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reusable-workflows
          # Kept as workflows/ and scripts/ (their common root).
          path: |
            workflows/*.yml
            scripts/pin-workflows.sh
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write # push to the runner branch; only this job has it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: actions-dist
          # Fresh dir: self-hosted workspaces persist, stale files must not be published.
          path: ${{ runner.temp }}/actions-dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reusable-workflows
          path: ${{ runner.temp }}/reusable-workflows

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: runner
          path: runner-branch
          clean: true

      - name: Sync built actions into the runner branch
        env:
          DIST: ${{ runner.temp }}/actions-dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=("$DIST"/*/)
          if [ ${#dirs[@]} -eq 0 ]; then echo "::error::artifact is empty"; exit 1; fi
          for dir in "${dirs[@]}"; do
            name=$(basename "$dir")
            target="runner-branch/.github/actions/$name"
            rm -rf "$target"
            mkdir -p "$target"
            cp -R "$dir". "$target/"
            echo "synced $name"
          done

      - name: Commit and push the actions if changed
        id: actions
        working-directory: runner-branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/actions
          if git diff --cached --quiet; then
            echo "No action changes to publish"
          else
            git commit -m "build: update JS actions from ${SOURCE_SHA::7}"
            # Someone may have committed to runner meanwhile: rebase and retry, bounded.
            pushed=false
            for i in 1 2 3; do
              if git push origin HEAD:runner; then pushed=true; break; fi
              git pull --rebase origin runner
            done
            [ "$pushed" = true ] || exit 1
          fi
          # The runner commit that holds the actions as published now: what the workflows pin.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # GitHub refuses a GITHUB_TOKEN push that changes .github/workflows (no `workflows` permission exists for it):
      # this push needs the secret WORKFLOWS_PUSH_TOKEN, a token with contents + workflows write on this repository
      # (a fine-grained PAT, or a classic one with the `workflow` scope). Without it the job fails with the command to
      # publish them by hand; the actions are already published by then.
      - name: Pin and commit the reusable workflows
        working-directory: runner-branch
        env:
          SRC: ${{ runner.temp }}/reusable-workflows
          SOURCE_SHA: ${{ github.sha }}
          ACTIONS_SHA: ${{ steps.actions.outputs.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          PUSH_TOKEN: ${{ secrets.WORKFLOWS_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          bash "$SRC/scripts/pin-workflows.sh" "$SRC/workflows" . "$ACTIONS_SHA" "$VERSION"
          git add .github/workflows
          if git diff --cached --quiet; then
            echo "No workflow changes to publish"
            exit 0
          fi
          git commit -m "build: update reusable workflows from ${SOURCE_SHA::7} (actions ${ACTIONS_SHA::7})"
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::WORKFLOWS_PUSH_TOKEN is not set, the reusable workflows were not published. From a clone of main: git worktree add ../ci-sdk-runner origin/runner && scripts/pin-workflows.sh workflows ../ci-sdk-runner $ACTIONS_SHA $VERSION, then commit .github/workflows there and push it to runner with a token that has the workflow scope"
            exit 1
          fi
          # The token reaches git through a credential helper (env), never the command line; the checkout's own
          # GITHUB_TOKEN header is cleared for this push only.
          push() {
            git -c http.https://github.com/.extraheader= -c credential.helper= \
              -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$PUSH_TOKEN"; }; f' \
              push origin HEAD:runner
          }
          for i in 1 2 3; do
            push && exit 0
            git pull --rebase origin runner
          done
          exit 1
