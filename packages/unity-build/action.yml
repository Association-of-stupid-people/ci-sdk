name: unity-build
description: >-
  Build a Unity project in a Docker container (default: the prebuilt GameCI image of the project's
  Unity version, pulled once per runner; nothing to install) or on the host editor (found by
  version, installed with Unity Hub when missing). Secrets go through
  environment variables, hung editors are killed, only license errors are retried, and errors from
  the Unity log are written to the job summary. Built on ci-sdk.
author: 'ci-sdk'

inputs:
  workdir:
    description: Unity project directory.
    required: false
    default: '.'
  version:
    description: >-
      Unity version (e.g. 2022.3.20f1). Empty = the UNITY_VER environment variable, then
      ProjectSettings/ProjectVersion.txt.
    required: false
  changeset:
    description: >-
      Changeset of that version (12 hex chars). Needed to install versions Hub does not list.
      Default: ProjectVersion.txt when the versions match, else Unity's release API.
    required: false
  mode:
    description: >-
      docker (Linux editor in a container; the runner only needs Docker) | host (editor installed on
      the runner, e.g. to compile iOS on macOS).
    required: false
    default: 'docker'
  default-args-override:
    description: Base Unity arguments. No shell; $(pwd) is replaced with the project path.
    required: false
    default: '-batchmode -nographics -silent-crashes -quit -logFile - -executeMethod BuildScript.BuildCLI'
  args:
    description: Extra Unity arguments (e.g. -buildTarget Android). Do not put passwords here.
    required: false
    default: ''
  timeout:
    description: >-
      Hard limit for one Unity run (e.g. 90m, 3h). The process tree is killed; in docker mode the
      container then gets up to 5 min to return the license seat. Keep the job's timeout-minutes
      above this + the image pull + 5 min.
    required: false
    default: '3h'
  idle-timeout:
    description: Kill Unity when it prints nothing for this long (hung editor). 0 = off.
    required: false
    default: '30m'
  license-retries:
    description: Extra attempts when (and only when) the log shows a license error.
    required: false
    default: '2'
  license-retry-delay:
    description: Delay before the first license retry; doubles each time.
    required: false
    default: '30s'
  license-error-patterns:
    description: Extra regular expressions (one per line, case-insensitive) that mean a license error.
    required: false
  keystore-path:
    description: Android keystore, relative to workdir. Passed as UNITY_KEYSTORE_PATH.
    required: false
  keystore-password:
    description: Keystore password. Passed as UNITY_KEYSTORE_PASS (environment only, masked).
    required: false
  keystore-alias:
    description: Key alias name. Passed as UNITY_KEYALIAS_NAME.
    required: false
  keystore-alias-password:
    description: Key alias password. Passed as UNITY_KEYALIAS_PASS (environment only, masked).
    required: false
  install:
    description: Install the editor / missing modules with the Unity Hub CLI when they are missing (host mode).
    required: false
    default: 'true'
  modules:
    description: >-
      Hub modules to require (android, ios, webgl, ...). auto = from -buildTarget; none = no modules.
    required: false
    default: 'auto'
  editor-path:
    description: Use this editor binary instead of searching (host mode).
    required: false
  editors-dir:
    description: >-
      Extra folders that hold one sub-folder per Unity version, comma or newline separated (host mode).
    required: false
  hub-path:
    description: Unity Hub binary (default locations are searched; host mode).
    required: false
  install-timeout:
    description: Time limit for a Hub install or a Docker image build/pull.
    required: false
    default: '1h'
  docker-image:
    description: Use this image (pulled when missing) instead of choosing one from docker-image-source.
    required: false
  docker-image-source:
    description: >-
      Where the editor image comes from. auto = GameCI unityci/editor:ubuntu-<version>-<module>-<gameci-version>,
      built locally from the Dockerfile when GameCI does not publish it (or when 2+ modules are needed) |
      gameci = GameCI only | build = never GameCI: ci-unity-editor:<version>-<modules> built from the
      Dockerfile. Either image is kept on the Docker daemon and reused by later runs.
    required: false
    default: 'auto'
  gameci-version:
    description: >-
      GameCI image version suffix: 3 = the newest 3.x.x at the first pull on this daemon (reused
      after that), or pin e.g. 3.2.2.
    required: false
    default: '3'
  docker-platform:
    description: >-
      Platform of the editor image (docker pull/build/run --platform). The Unity Linux editor and
      the GameCI images are x86_64 only. none = no --platform (the Docker daemon's default).
    required: false
    default: 'linux/amd64'
  docker-image-repo:
    description: Repository name of the images this action builds locally.
    required: false
    default: 'ci-unity-editor'
  dockerfile:
    description: >-
      Dockerfile for docker-image-source build, and for auto when GameCI has no image (default: the
      bundled one; its folder is the build context).
    required: false
  docker-env:
    description: >-
      Extra environment variable names to forward into the container. CI and the GitHub context
      variables (GITHUB_SHA, GITHUB_RUN_NUMBER, GITHUB_REF_NAME, ...) are always forwarded.
    required: false
  docker-gradle-volume:
    description: Named volume for /root/.gradle, kept between builds. none = no volume.
    required: false
    default: 'ci-unity-gradle'
  unity-license-file:
    description: >-
      .ulf license file mounted into the container (docker mode only: a .ulf is bound to the machine
      it was made for; in host mode use unity-serial).
    required: false
  unity-serial:
    description: >-
      Unity serial to activate before the build. Docker mode: inside the container, returned after
      the build. Host mode: with the runner's editor (on its command line, with the account),
      skipped when the machine-wide license already holds this serial; see return-license. For a
      Personal license, the serial that extract-unity-serial reads from the .ulf. Needs unity-email
      and unity-password.
    required: false
  unity-email:
    description: Unity account email for unity-serial (required with it).
    required: false
  unity-password:
    description: Unity account password for unity-serial (required with it).
    required: false
  return-license:
    description: >-
      Return the unity-serial seat after the build (also after a failure, a timeout or a cancel).
      auto = docker mode returns, host mode keeps it (the machine persists and other runners on it
      may be building with the same machine-wide license) | true = return in host mode too | false =
      keep it in host mode (docker mode always returns).
    required: false
    default: 'auto'
  clean-gradle-cache:
    description: >-
      Delete the Gradle cache first: ~/.gradle/caches (host mode) or the docker-gradle-volume (docker
      mode; a volume another build is using stays, with a warning). auto = on macOS hosts in host
      mode only (old composite behaviour).
    required: false
    default: 'auto'
  summary:
    description: Write the result and the Unity log errors to the job summary.
    required: false
    default: 'true'
  debug-view:
    description: >-
      QA builds only: inject the BIBG Debug View client into Assets/BibgDebugView and patch
      firebase-analytics-dll before Unity starts, both removed after the build. Ignored on a tag
      build (a release never gets it). Whatever this says, every build first removes a stale
      client and restores the Firebase DLL from git, and fails if it cannot.
    required: false
    default: 'false'
  debug-view-url:
    description: BIBG base URL (https) that serves the Debug View files and receives the events.
    required: false
    default: 'https://bi.blackgems.org'
  firebase-analytics-dll:
    description: >-
      Firebase.Analytics.dll committed in the project, relative to workdir. Empty = the
      FIREBASE_ANALYTICS_DLL variable, then Assets/Firebase/Plugins/Firebase.Analytics.dll. none =
      the game has no committed Firebase DLL: no patch (LogBridge fallback) and no restore of this
      path. Any other tracked Firebase.Analytics.dll holding the patch is restored in every build.
    required: false

outputs:
  status:
    description: success | failure | cancelled
  failure-kind:
    description: 'Empty on success, else: license | build | timeout | hang'
  unity-version:
    description: Unity version used.
  editor-path:
    description: Editor binary used (host mode).
  image:
    description: Docker image used (docker mode).
  attempts:
    description: Number of Unity runs.
  log-file:
    description: Full Unity log (upload it with actions/upload-artifact on failure).
  errors:
    description: JSON array of the errors found in the Unity log.
  debug-view:
    description: true when the BIBG Debug View client was injected into this build (and the DLL patched).

runs:
  using: node24
  main: dist/index.js
